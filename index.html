<body>

  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7.6 3.5H5.3A1.8 1.8 0 0 0 3.5 5.4c0 8.4 6.7 15.1 15.1 15.1a1.8 1.8 0 0 0 1.9-1.8v-2.3l-4.3-1.6-1.9 2.2a13.6 13.6 0 0 1-5.4-5.4l2.2-1.9z"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7"/><path d="M3.4 12h17.2M12 3.3c2.4 2.5 3.6 5.5 3.6 8.7S14.4 18.2 12 20.7C9.6 18.2 8.4 15.2 8.4 12S9.6 5.8 12 3.3z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="12" height="12" rx="2.6"/><path d="M15.5 5.6a2.1 2.1 0 0 0-2.1-2.1H5.6a2.1 2.1 0 0 0-2.1 2.1v7.8a2.1 2.1 0 0 0 2.1 2.1"/></symbol>

  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.6v11.2M7.4 10.4L12 15l4.6-4.6M4 17.4v1.6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.6"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 12.2c0 4.2-3.8 7.6-8.5 7.6a9.7 9.7 0 0 1-2.7-.4L4.2 21l1.3-3.6a7.2 7.2 0 0 1-2-4.9c0-4.2 3.8-7.6 8.5-7.6s8.5 3.4 8.5 7.3z"/><circle cx="8.6" cy="12.2" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.4" cy="12.2" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-social" viewBox="0 0 24 24"><circle cx="18" cy="5.6" r="2.7"/><circle cx="6" cy="12" r="2.7"/><circle cx="18" cy="18.4" r="2.7"/><path d="M8.4 10.7l7.2-3.8M8.4 13.3l7.2 3.8"/></symbol>

<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-in">
    <div class="ident">
      <span class="avatar" aria-hidden="true">MJ</span>
      <span class="ident-txt">
        <strong id="topName">Mu Jou</strong>
        <small data-i18n="kicker">Digital Business Card</small>
      </span>
    </div>
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <svg class="ico" aria-hidden="true"><use href="#i-lang"></use></svg>
      <span id="langBtnLabel">EN</span>
    </button>
  </div>
</header>

<main class="wrap">

  <section class="stage" aria-roledescription="carousel">
    <div class="rail">
      <div class="cards" id="cards" tabindex="0" role="group" aria-label="Business cards"></div>
    </div>

    <div class="controls">
      <button class="nav-arrow" id="prevBtn" type="button" data-i18n-aria="prev" aria-label="Previous card">
        <svg class="ico" aria-hidden="true"><use href="#i-chevron-l"></use></svg>
      </button>
      <div class="dots" id="dots" role="tablist" aria-label="Select card"></div>
      <button class="nav-arrow" id="nextBtn" type="button" data-i18n-aria="next" aria-label="Next card">
        <svg class="ico" aria-hidden="true"><use href="#i-chevron-r"></use></svg>
      </button>
    </div>
  </section>

  <section class="detail">
    <div class="info" id="info">
      <h1 class="name" id="cName">Mu Jou</h1>
      <p class="role" id="cRole"></p>
      <ul class="contacts" id="contacts"></ul>
    </div>

    <div class="actions">
      <a class="btn btn-primary" id="btnContact" href="#" data-i18n="addContact">
        <svg class="ico" aria-hidden="true"><use href="#i-contact"></use></svg>
        <span>Add to Contact</span>
      </a>
      <div class="btn-row">
        <button class="btn" id="btnDownload" type="button">
          <svg class="ico" aria-hidden="true"><use href="#i-download"></use></svg>
          <span data-i18n="download">Download</span>
        </button>
        <a class="btn" id="btnChat" href="#" target="_blank" rel="noopener">
          <svg class="ico" aria-hidden="true"><use href="#i-chat"></use></svg>
          <span data-i18n="chat">Chat</span>
        </a>
        <button class="btn" id="btnSocial" type="button">
          <svg class="ico" aria-hidden="true"><use href="#i-social"></use></svg>
          <span data-i18n="social">Social</span>
        </button>
      </div>
    </div>
  </section>

</main>

<div class="sheet-scrim" id="scrim" hidden></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Social</h2>
    <button class="icon-btn" id="sheetClose" type="button" data-i18n-aria="close" aria-label="Close">
      <svg class="ico" aria-hidden="true"><use href="#i-close"></use></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
  <button class="lb-close icon-btn" id="lbClose" type="button" data-i18n-aria="close" aria-label="Close">
    <svg class="ico" aria-hidden="true"><use href="#i-close"></use></svg>
  </button>
  <img class="lb-img" id="lbImg" src="" alt="">
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
